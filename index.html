<style>
  :root{
    --viewbox-bg: #101a2e;
    --viewbox-bg-deep: #0b1424;
    --panel: #16223b;
    --panel-line: #2a3a5c;
    --glow: #8fd6e8;
    --glow-dim: #5c8fa3;
    --bone: #f2ede1;
    --bone-dim: #c9c2b2;
    --amber: #e0a458;
    --text-main: #e9edf3;
    --text-soft: #a9b4c8;
    --serif: 'Newsreader', Georgia, serif;
    --sans: 'Work Sans', -apple-system, Helvetica, Arial, sans-serif;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --viewbox-bg: #eef1f6; --viewbox-bg-deep: #e3e7ee; --panel: #ffffff;
      --panel-line: #d7dce6; --text-main: #1a2233; --text-soft: #57627a; --bone: #1a2233;
    }
  }
  :root[data-theme="light"] {
    --viewbox-bg: #eef1f6; --viewbox-bg-deep: #e3e7ee; --panel: #ffffff;
    --panel-line: #d7dce6; --text-main: #1a2233; --text-soft: #57627a; --bone: #1a2233;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background: var(--viewbox-bg-deep); color: var(--text-main); font-family: var(--sans); line-height:1.5; }
  .app{ max-width: 1120px; margin: 0 auto; padding: 0 20px 80px; }
  header.hero{
    background: linear-gradient(180deg, var(--viewbox-bg) 0%, var(--viewbox-bg-deep) 100%);
    border-bottom: 1px solid var(--panel-line);
    padding: 40px 20px 28px; margin: 0 -20px 32px;
    position: sticky; top: 0; z-index: 10;
  }
  .hero-inner{ max-width: 1120px; margin: 0 auto; }
  .eyebrow{ font-size: 13px; color: var(--glow); letter-spacing: 0.02em; margin: 0 0 6px; }
  h1{ font-family: var(--serif); font-weight: 500; font-size: clamp(24px, 4.5vw, 36px); margin: 0 0 10px; color: var(--bone); }
  .hero p.sub{ color: var(--text-soft); max-width: 560px; margin: 0 0 22px; font-size: 15px; }
  .search-row{ display:flex; gap: 10px; flex-wrap: wrap; }
  #searchInput{
    flex: 1 1 280px; background: var(--panel); border: 1px solid var(--panel-line);
    border-radius: 8px; padding: 13px 16px; color: var(--text-main); font-size: 15px; font-family: var(--sans);
  }
  #searchInput:focus{ outline: 2px solid var(--glow); outline-offset: 1px; }
  #searchInput::placeholder{ color: var(--text-soft); }
  #searchResults{ margin-top: 12px; }
  .search-hit{
    display:block; width:100%; text-align:left; background: var(--panel); border: 1px solid var(--panel-line);
    border-radius: 8px; padding: 10px 14px; color: var(--text-main); font-family: var(--sans);
    font-size: 14.5px; margin-bottom: 8px; cursor: pointer;
  }
  .search-hit:hover{ border-color: var(--glow-dim); }
  .search-hit .hit-region{ color: var(--text-soft); font-size: 12.5px; }

  .picker-groups{ margin-top: 16px; display:none; }
  .picker-groups.open{ display:block; }
  .picker-group{ margin-bottom: 12px; }
  .picker-group-label{ font-size: 11.5px; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .region-picker{ display:flex; gap:8px; flex-wrap: wrap; }
  .region-chip{
    background: transparent; border: 1px solid var(--panel-line); color: var(--text-soft);
    padding: 6px 13px; border-radius: 999px; font-size: 13.5px; font-family: var(--sans); cursor:pointer;
  }
  .region-chip[aria-pressed="true"]{ border-color: var(--glow); color: var(--bone); background: rgba(143,214,232,0.08); }
  .region-chip:focus-visible{ outline: 2px solid var(--glow); outline-offset:2px; }
  .toggle-browse{
    margin-top: 14px; background: none; border: none; color: var(--glow); font-size: 13px;
    font-family: var(--sans); cursor: pointer; padding: 0;
  }

  main#region-view{ display:none; }
  main#region-view.active{ display:block; }
  .region-title{ display:flex; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
  .region-title h2{ font-family: var(--serif); font-weight: 500; font-size: 28px; margin: 0; color: var(--bone); }
  .region-title .region-tag{ color: var(--glow); font-size: 13px; }

  section.block{ margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--panel-line); }
  section.block h3{ font-family: var(--serif); font-size: 18px; font-weight: 500; margin: 0 0 14px; color: var(--bone); }
  .view-card{ background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; padding: 15px 18px; margin-bottom: 10px; }
  .view-card .name{ font-weight: 600; font-size: 14.5px; margin-bottom: 6px; color: var(--bone); }
  .view-card .field{ font-size: 13.5px; color: var(--text-soft); margin-top: 4px; }
  .view-card .field b{ color: var(--text-main); font-weight: 600; }

  .anatomy-text{ font-size: 15px; color: var(--text-main); max-width: 68ch; }
  .anatomy-label{ display:block; font-size: 12.5px; color: var(--glow); margin-bottom: 4px; }

  .fracture-card{
    background: var(--panel); border: 1px solid var(--panel-line); border-left: 3px solid var(--amber);
    border-radius: 8px; padding: 15px 18px; margin-bottom: 12px; scroll-margin-top: 140px;
  }
  .fracture-card.flash{ border-left-color: var(--glow); background: rgba(143,214,232,0.06); }
  .fracture-card .fname{ font-family: var(--serif); font-size: 17px; color: var(--bone); margin: 0 0 8px; }
  .fracture-card .field{ font-size: 13.5px; color: var(--text-soft); margin-top: 5px; }
  .fracture-card .field b{ color: var(--text-main); font-weight: 600; }
  .fracture-card .note{ margin-top: 10px; font-size: 13.5px; color: var(--bone-dim); font-style: italic; }

  .img-refs{ margin-top: 8px; display:flex; gap:8px; flex-wrap: wrap; }
  .img-refs a{
    font-size: 12.5px; color: var(--glow); text-decoration: none; border: 1px solid var(--panel-line);
    padding: 5px 10px; border-radius: 999px;
  }
  .img-refs a:hover{ border-color: var(--glow); }
  .empty-note{ color: var(--text-soft); font-size: 14px; padding: 10px 0; }

  @media (max-width: 560px){
    header.hero{ padding: 26px 16px 18px; position: static; }
    .app{ padding: 0 16px 60px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Radiography Study Atlas</p>
      <h1>Positions, anatomy, fractures.</h1>
      <p class="sub">Search a fracture or region, or browse the full skeleton by group.</p>
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Search a fracture (e.g. Colles) or a region (e.g. Foot)…" autocomplete="off">
      </div>
      <div id="searchResults"></div>
      <button class="toggle-browse" id="browseToggle">Browse all regions ↓</button>
      <div class="picker-groups" id="pickerGroups"></div>
    </div>
  </header>
  <main id="region-view"></main>
</div>

      { name: "Basilar Skull Fracture", location: "Skull base", mechanism: "High-energy trauma, often with a fracture line extending from the vault", findings: "Often not directly visible — diagnosed from indirect signs: periorbital ecchymosis ('raccoon eyes'), mastoid ecchymosis (Battle's sign), CSF rhinorrhea/otorrhea, hemotympanum", note: "A clinical/indirect-sign diagnosis as much as an imaging one — CT with bone windows is the modality of choice when suspected." }
    ]
  },
  {
    id: "facial", name: "Facial Bones", region: "Axial",
    routineViews: [
      { name: "Waters' View (Occipitomental)", positioning: "Chin extended against IR, forehead off the IR, CR horizontal", purpose: "Orbital floors, maxillary sinuses, zygomatic arches — the primary facial trauma screening view" },
      { name: "Caldwell View (PA, 15° caudad)", positioning: "Forehead and nose against IR, CR angled 15° caudad", purpose: "Orbital rims and frontal sinuses" }
    ],
    specialViews: [
      { name: "Submentovertex (SMV)", positioning: "Neck hyperextended, top of head against IR, CR perpendicular to the infraorbitomeatal line", purpose: "Zygomatic arches in profile — largely replaced by CT in current practice" }
    ],
    anatomy: { normal: "Maxilla, zygoma, nasal bones, and orbits make up the midface; the mandible articulates with the temporal bone at the temporomandibular joint (TMJ).", crossSectional: "Axial and coronal CT is the gold standard for facial trauma — plain films are now mainly a rapid initial screen, with CT used for anything beyond a simple, isolated nasal fracture." },
    fractures: [
      { name: "Le Fort Fracture (I/II/III)", location: "Maxilla, classified by fracture plane level", mechanism: "High-energy midface trauma", findings: "Le Fort I: horizontal, above the teeth apices. Le Fort II: pyramidal, through the nasal bridge and maxilla. Le Fort III: craniofacial separation, through the zygomatic arches and orbits", note: "The three types can co-exist on the same or opposite sides — assess each side independently." },
      { name: "Zygomaticomaxillary Complex (Tripod) Fracture", location: "Zygomatic arch, orbital floor/rim, and zygomaticomaxillary buttress", mechanism: "Direct blow to the cheek", findings: "Fracture at all three named attachment points of the zygoma", note: "Despite the name implying three points, it's really a fracture around the zygoma's four articulations — 'tripod' is the traditional, if imprecise, term." },
      { name: "Orbital Blowout Fracture", location: "Orbital floor most commonly, sometimes medial wall", mechanism: "Direct blow to the globe transmitting force to the thin orbital floor (e.g. a ball or fist)", findings: "Depressed floor fragment with soft tissue/fat herniating into the maxillary sinus — the 'teardrop sign' on Waters' view", note: "Watch for an entrapped extraocular muscle, which is a surgical urgency regardless of the fracture size." }
    ]
  },
  {
    id: "chest-ribs", name: "Chest / Ribs", region: "Axial",
    routineViews: [
      { name: "PA Chest", positioning: "Upright, chest against IR, arms rotated forward to move scapulae off the lung fields, CR to T7", purpose: "Lung fields, mediastinum, ribs, heart silhouette" },
      { name: "Lateral Chest", positioning: "Upright, arms raised, side against IR", purpose: "Confirms location of findings seen on PA, evaluates retrocardiac and retrosternal spaces" },
      { name: "AP/Oblique Ribs", positioning: "Centered to the area of clinical concern, above or below the diaphragm depending on suspected level", purpose: "Dedicated rib detail beyond what a routine chest film shows" }
    ],
    specialViews: [
      { name: "Expiration Film", positioning: "Same as PA chest, exposed at full expiration instead of inspiration", purpose: "Increases conspicuity of a small pneumothorax by reducing lung volume relative to the pleural air" }
    ],
    anatomy: { normal: "12 pairs of ribs articulate posteriorly with the thoracic vertebrae and (for ribs 1-10) anteriorly with the sternum via costal cartilage; ribs 11-12 are 'floating' with no anterior attachment.", crossSectional: "Axial CT is far more sensitive than plain film for occult rib fractures and for detecting associated pulmonary contusion, hemothorax, or vascular injury." },
    fractures: [
      { name: "Simple Rib Fracture", location: "Any rib, single or few, single fracture site each", mechanism: "Direct blow or fall", findings: "Cortical discontinuity, often subtle on plain film — many rib fractures are only confirmed on CT", note: "Management is largely clinical (pain control, incentive spirometry) rather than imaging-driven once the diagnosis is made." },
      { name: "Flail Chest", location: "Three or more consecutive ribs, each fractured in two or more places", mechanism: "High-energy blunt chest trauma", findings: "A free-floating segment of chest wall visible as paradoxical movement clinically; multiple fracture sites per rib on imaging", note: "A clinical and mechanical diagnosis (paradoxical chest wall motion) as much as a radiographic one." },
      { name: "Sternal Fracture", location: "Sternum, usually the body", mechanism: "Direct anterior chest trauma (classically a steering wheel injury)", findings: "Best seen on the lateral chest view or dedicated sternal obliques; associated with underlying cardiac contusion in higher-energy mechanisms", note: "Given the anatomic proximity, a sternal fracture should prompt consideration of cardiac injury, not just the bone itself." }
    ]
  }
];

const IMG_SOURCES = [
  { label: "Radiopaedia", url: "https://radiopaedia.org/search?q=" },
  { label: "Wikimedia Commons", url: "https://commons.wikimedia.org/w/index.php?search=" }
];
const ANATOMY_SOURCES = ["Kenhub", "Anatomy Learning", "TM Anatomy"];
const CROSS_SECTIONAL_SOURCES = ["TC-Tomografia", "Radio Anatomy"];

function googleLink(sourceName, query){
  return `https://www.google.com/search?q=${encodeURIComponent(sourceName + ' ' + query)}`;
}
function anatomyLinksHTML(sourceNames, regionName, suffix){
  const q = `${regionName} ${suffix}`;
  return `<div class="img-refs">${sourceNames.map(s => `<a href="${googleLink(s, q)}" target="_blank" rel="noopener">${s} ↗</a>`).join('')}</div>`;
}
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

const REGION_ORDER = ["Upper Limb", "Lower Limb", "Spine", "Axial"];

function renderRegionPicker(){
  const el = document.getElementById('pickerGroups');
  el.innerHTML = REGION_ORDER.map(group => {
    const members = DATA.filter(r => r.region === group);
    if(!members.length) return '';
    return `<div class="picker-group">
      <div class="picker-group-label">${group}</div>
      <div class="region-picker">
        ${members.map(r => `<button class="region-chip" data-id="${r.id}" aria-pressed="false">${r.name}</button>`).join('')}
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('.region-chip').forEach(btn=>{
    btn.addEventListener('click', ()=> { showRegion(btn.dataset.id); closePicker(); });
  });
}

function closePicker(){
  document.getElementById('pickerGroups').classList.remove('open');
  document.getElementById('browseToggle').textContent = 'Browse all regions ↓';
}
document.getElementById('browseToggle').addEventListener('click', ()=>{
  const el = document.getElementById('pickerGroups');
  const open = el.classList.toggle('open');
  document.getElementById('browseToggle').textContent = open ? 'Hide region list ↑' : 'Browse all regions ↓';
});

function fractureCardHTML(f, regionId, flash){
  const searchTerm = encodeURIComponent(f.name.replace(/'/g,''));
  return `
    <div class="fracture-card${flash ? ' flash' : ''}" id="fx-${regionId}-${slug(f.name)}">
      <p class="fname">${f.name}</p>
      <div class="field"><b>Location:</b> ${f.location}</div>
      <div class="field"><b>Mechanism:</b> ${f.mechanism}</div>
      <div class="field"><b>Imaging findings:</b> ${f.findings}</div>
      ${f.note ? `<p class="note">${f.note}</p>` : ''}
      <div class="img-refs">
        ${IMG_SOURCES.map(s => `<a href="${s.url}${searchTerm}" target="_blank" rel="noopener">${s.label} ↗</a>`).join('')}
      </div>
    </div>`;
}

function renderRegion(r, flashFracture){
  const main = document.getElementById('region-view');
  const specialBlock = r.specialViews.length ? `
    <section class="block">
      <h3>Special Views</h3>
      ${r.specialViews.map(v => `
        <div class="view-card">
          <div class="name">${v.name}</div>
          <div class="field"><b>Positioning:</b> ${v.positioning}</div>
          <div class="field"><b>Purpose:</b> ${v.purpose}</div>
        </div>`).join('')}
    </section>` : '';

  main.innerHTML = `
    <div class="region-title">
      <h2>${r.name}</h2>
      <span class="region-tag">${r.region}</span>
    </div>

    <section class="block">
      <h3>Routine Views</h3>
      ${r.routineViews.map(v => `
        <div class="view-card">
          <div class="name">${v.name}</div>
          <div class="field"><b>Positioning:</b> ${v.positioning}</div>
          <div class="field"><b>Purpose:</b> ${v.purpose}</div>
        </div>`).join('')}
    </section>

    ${specialBlock}

    <section class="block">
      <h3>Anatomy</h3>
      <span class="anatomy-label">Normal anatomy</span>
      <p class="anatomy-text">${r.anatomy.normal}</p>
      ${anatomyLinksHTML(ANATOMY_SOURCES, r.name, 'anatomy diagram')}
      <span class="anatomy-label" style="margin-top:16px;display:block;">Cross-sectional</span>
      <p class="anatomy-text">${r.anatomy.crossSectional}</p>
      ${anatomyLinksHTML(CROSS_SECTIONAL_SOURCES, r.name, 'cross sectional CT anatomy')}
    </section>

    <section class="block">
      <h3>Common Fractures</h3>
      ${r.fractures.map(f => fractureCardHTML(f, r.id, flashFracture === f.name)).join('')}
    </section>
  `;
  main.classList.add('active');
}

function showRegion(id, flashFracture){
  const r = DATA.find(x => x.id === id);
  document.querySelectorAll('.region-chip').forEach(btn=>{
    btn.setAttribute('aria-pressed', btn.dataset.id === id ? 'true' : 'false');
  });
  renderRegion(r, flashFracture);
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('searchInput').value = '';
  if(flashFracture){
    requestAnimationFrame(()=>{
      const target = document.getElementById(`fx-${id}-${slug(flashFracture)}`);
      if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
    });
  } else {
    document.getElementById('region-view').scrollIntoView({behavior:'smooth', block:'start'});
  }
}

function buildFractureIndex(){
  const idx = [];
  DATA.forEach(r => r.fractures.forEach(f => idx.push({ fractureName: f.name, regionId: r.id, regionName: r.name })));
  return idx;
}
const FRACTURE_INDEX = buildFractureIndex();

function runSearch(q){
  const results = document.getElementById('searchResults');
  q = q.trim().toLowerCase();
  if(!q){ results.innerHTML=''; return; }

  const fxHits = FRACTURE_INDEX.filter(f => f.fractureName.toLowerCase().includes(q));
  const regionHits = DATA.filter(r => r.name.toLowerCase().includes(q) && !fxHits.some(f=>f.regionId===r.id));

  if(fxHits.length === 0 && regionHits.length === 0){
    results.innerHTML = `<p class="empty-note">No match for "${q}" yet — try a fracture name (Colles, Jones) or region (Foot, Wrist).</p>`;
    return;
  }

  let html = '';
  fxHits.forEach(f=>{
    html += `<button class="search-hit" data-region="${f.regionId}" data-fx="${f.fractureName}">
      ${f.fractureName} <span class="hit-region">— ${f.regionName}</span>
    </button>`;
  });
  regionHits.forEach(r=>{
    html += `<button class="search-hit" data-region="${r.id}">
      ${r.name} <span class="hit-region">— browse region</span>
    </button>`;
  });
  results.innerHTML = html;
  results.querySelectorAll('.search-hit').forEach(btn=>{
    btn.addEventListener('click', ()=> showRegion(btn.dataset.region, btn.dataset.fx || null));
  });
}

document.getElementById('searchInput').addEventListener('input', e => runSearch(e.target.value));

renderRegionPicker();
document.getElementById('pickerGroups').classList.add('open');
document.getElementById('browseToggle').textContent = 'Hide region list ↑';
showRegion('foot');

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
}
</script>
</body>
</html>
